name: Spec check
description: Flags a pull request that is bigger than small and has no valid, linked OpenSpec change. Warns by default.
inputs:
  config:
    description: Path to the settings file, read from the base branch.
    default: .github/spec-check.jsonc
  openspec-version:
    description: Exact OpenSpec version to run. Keep it pinned.
    default: 2.0.0
  node-version:
    description: Node.js version (OpenSpec 2.x needs 22.12 or newer).
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install OpenSpec (pinned, telemetry off)
      shell: bash
      env:
        OPENSPEC_VERSION: ${{ inputs.openspec-version }}
      run: |
        npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/openspec" "@fission-ai/openspec@${OPENSPEC_VERSION}"
        echo "OPENSPEC_BIN=$RUNNER_TEMP/openspec/node_modules/.bin/openspec" >> "$GITHUB_ENV"
    - name: Check the pull request
      shell: bash
      env:
        OPENSPEC_TELEMETRY: '0'
        DO_NOT_TRACK: '1'
        OPENSPEC_NO_UPDATE_CHECK: '1'
        SPEC_CHECK_CONFIG: ${{ inputs.config }}
      # The PR body, labels and commits come from the event file, never from shell interpolation.
      run: node "$GITHUB_ACTION_PATH/spec-check.mjs" --repo "$GITHUB_WORKSPACE"
